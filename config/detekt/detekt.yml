# detekt configuration for ISA Eye.
#
# Applied on top of detekt's default configuration (see `buildUponDefaultConfig`
# in app/build.gradle.kts), so only deviations from the defaults need to live here.

ktlint:
  active: true
  code_style: 'ktlint_official'
  indentStyle: 'space'

  # detekt's bundled ktlint wrapper does not read .editorconfig (detekt#8815), so every value the
  # project relies on has to be mirrored here explicitly to keep the two tools aligned:
  #   * indentSize  - .editorconfig uses 2-space indentation; each rule defaults to 4.
  #   * maxLineLength - .editorconfig uses 100; each wrapping rule defaults to 120.
  MultilineRawStringIndentation:
    indentSize: 2
  AnnotationOnSeparateLine:
    indentSize: 2
  ArgumentListWrapping:
    indentSize: 2
    maxLineLength: 100
  BinaryExpressionWrapping:
    indentSize: 2
    maxLineLength: 100
  ChainMethodContinuation:
    indentSize: 2
    maxLineLength: 100
  ChainWrapping:
    indentSize: 2
  ClassSignature:
    indentSize: 2
    maxLineLength: 100
  CommentWrapping:
    indentSize: 2
  ConditionWrapping:
    indentSize: 2
    maxLineLength: 100
  ContextReceiverListWrapping:
    indentSize: 2
    maxLineLength: 100
  ContextReceiverMapping:
    indentSize: 2
  EnumWrapping:
    indentSize: 2
  ExpressionOperandWrapping:
    indentSize: 2
    maxLineLength: 100
  FunctionExpressionBody:
    indentSize: 2
  FunctionLiteral:
    indentSize: 2
    maxLineLength: 100
  FunctionSignature:
    indentSize: 2
    maxLineLength: 100
  IfElseBracing:
    indentSize: 2
  IfElseWrapping:
    indentSize: 2
    maxLineLength: 100
  Indentation:
    indentSize: 2
  KdocWrapping:
    indentSize: 2
    maxLineLength: 100
  ModifierListSpacing:
    indentSize: 2
  MultiLineIfElse:
    indentSize: 2
  MultilineExpressionWrapping:
    indentSize: 2
    maxLineLength: 100
  MultilineLoop:
    indentSize: 2
  NoEmptyFirstLineInClassBody:
    indentSize: 2
  NoSingleLineBlockComment:
    indentSize: 2
  ParameterListWrapping:
    indentSize: 2
    maxLineLength: 100
  ParameterWrapping:
    indentSize: 2
    maxLineLength: 100
  PropertyWrapping:
    indentSize: 2
    maxLineLength: 100
  SpacingAroundCurly:
    indentSize: 2
  StatementWrapping:
    indentSize: 2
    maxLineLength: 100
  StringTemplateIndent:
    indentSize: 2
  TryCatchFinallySpacing:
    indentSize: 2
  TypeArgumentListSpacing:
    indentSize: 2
  TypeParameterListSpacing:
    indentSize: 2
  WhenEntryBracing:
    indentSize: 2
  Wrapping:
    indentSize: 2
    maxLineLength: 100

  # Align with the project's 100-column limit (detekt's bundled ktlint defaults to 120).
  MaxLineLength:
    maxLineLength: 100

  # The generated Material Symbols vectors use a `_name` backing-property idiom.
  BackingPropertyNaming:
    active: false

naming:
  FunctionNaming:
    # Compose composables are PascalCase by convention.
    functionPattern: '[A-Za-z][a-zA-Z0-9]*'

style:
  # Compose layouts are full of literal dimensions/alpha values; noise outweighs value.
  MagicNumber:
    active: false
