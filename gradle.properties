# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
# Never provision JDKs at build time. The build requests no toolchain, and F-Droid's scanner
# rejects auto-provisioning plugins such as the foojay resolver.
org.gradle.java.installations.auto-download=false
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Compose Preview Screenshot Testing, wired through AGP's test suite support.
android.experimental.enableScreenshotTest=true
android.experimental.testSuiteSupport=true
