name: Tag

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  version:
    name: Version is new
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Compare with the previous tag
        run: |
          set -eu
          current="${GITHUB_REF_NAME}"
          previous="$(git tag --list 'v*' --sort=-v:refname | grep -vx "$current" | head -n 1)"
          if [ -z "$previous" ]; then
            echo "No previous tag, so there is nothing to compare against."
            exit 0
          fi
          if [ "$(printf '%s\n%s\n' "$previous" "$current" | sort -V | tail -n 1)" != "$current" ]; then
            echo "::error::$current does not sort after $previous."
            exit 1
          fi
          current_code="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts)"
          if [ -z "$current_code" ]; then
            echo "::error::No versionCode found in app/build.gradle.kts."
            exit 1
          fi
          previous_code="$(git show "$previous:app/build.gradle.kts" | sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p')"
          if [ "$current_code" -le "$previous_code" ]; then
            echo "::error::versionCode $current_code is not greater than $previous_code from $previous."
            exit 1
          fi
          echo "$current sorts after $previous and versionCode $current_code is greater than $previous_code."

  reproducible:
    name: Reproducible build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The check clones this repository, so it needs the tagged commit rather than a shallow
          # copy.
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./scripts/check-reproducible-build.sh

  release:
    name: Publish release
    runs-on: ubuntu-24.04
    # Only publish binaries that already passed the version and reproducibility checks.
    needs: [version, reproducible]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Unpack the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ISA_EYE_KEYSTORE_BASE64 }}
        run: |
          set -eu
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ISA_EYE_KEYSTORE_BASE64 is not set, so the APK would be unsigned."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/isa-eye-upload.jks"
          chmod 600 "$RUNNER_TEMP/isa-eye-upload.jks"
      - name: Check the Play licensing key is configured
        env:
          ISA_EYE_PLAY_LICENSING_PUBLIC_KEY: ${{ secrets.ISA_EYE_PLAY_LICENSING_PUBLIC_KEY }}
        run: |
          set -eu
          if [ -z "${ISA_EYE_PLAY_LICENSING_PUBLIC_KEY:-}" ]; then
            echo "::error::ISA_EYE_PLAY_LICENSING_PUBLIC_KEY is not set, so purchases would not be verifiable."
            exit 1
          fi
      - name: Build the signed release artifacts
        env:
          ISA_EYE_KEYSTORE_FILE: ${{ runner.temp }}/isa-eye-upload.jks
          ISA_EYE_KEYSTORE_PASSWORD: ${{ secrets.ISA_EYE_KEYSTORE_PASSWORD }}
          ISA_EYE_KEY_ALIAS: ${{ secrets.ISA_EYE_KEY_ALIAS }}
          ISA_EYE_KEY_PASSWORD: ${{ secrets.ISA_EYE_KEY_PASSWORD }}
          ISA_EYE_PLAY_LICENSING_PUBLIC_KEY: ${{ secrets.ISA_EYE_PLAY_LICENSING_PUBLIC_KEY }}
        run: ./gradlew :app:assembleFdroidRelease :app:bundleGpeRelease --no-daemon
      - name: Publish the F-Droid APK and mappings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          apk="$RUNNER_TEMP/me.dylmye.isa-$version.apk"
          mapping="$RUNNER_TEMP/me.dylmye.isa-$version-mapping.txt"
          gpe_mapping="$RUNNER_TEMP/me.dylmye.isa-$version-gpe-mapping.txt"
          cp app/build/outputs/apk/fdroid/release/app-fdroid-release.apk "$apk"
          # R8 renames every class, so a crash report from a released APK can only be read with the
          # mapping that produced it. The F-Droid mapping stays beside the APK; the GPE mapping is
          # for Play crash reports and is attached with a channel suffix.
          cp app/build/outputs/mapping/fdroidRelease/mapping.txt "$mapping"
          cp app/build/outputs/mapping/gpeRelease/mapping.txt "$gpe_mapping"

          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "ISA Eye $version" \
              --notes "Built from $GITHUB_SHA."
          gh release upload "$GITHUB_REF_NAME" "$apk" "$mapping" "$gpe_mapping" --clobber
      - name: Point the F-Droid recipe at this release
        run: ./scripts/update-fdroid-metadata.sh "$GITHUB_REF_NAME"
      - name: Commit the recipe update
        run: |
          set -eu
          if git diff --quiet -- fdroid; then
            echo "The recipe already describes $GITHUB_REF_NAME."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fdroid/me.dylmye.isa.yml
          # [skip ci]: this commit only touches recipe metadata, and the tag already passed every
          # check.
          git commit -m "chore: point the F-Droid recipe at ${GITHUB_REF_NAME#v} [skip ci]"
          # The tag was cut from main, so this fast-forwards unless something landed alongside it.
          # Pushing a plain commit keeps that failure loud instead of overwriting the other change.
          git push origin HEAD:main
